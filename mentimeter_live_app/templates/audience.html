<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ session.title }} | Participar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=asset_version) }}">
</head>
<body class="audience-shell audience-shell--pro" data-theme="{{ (session.config_json or {}).get('theme', 'civic') }}">
    <main class="audience-card audience-card--pro" data-audience data-code="{{ session.code }}" data-token="{{ participant.token }}" aria-labelledby="audience-title">
        <header class="audience-header">
            <div class="audience-brand-row">
                <span class="brand-mark brand-mark--small" aria-hidden="true">L</span>
                <span>Live Studio</span>
                <span class="audience-code">Código {{ session.code }}</span>
            </div>
            <div class="audience-title-row">
                <div>
                    <p class="eyebrow">Participación en vivo</p>
                    <h1 id="audience-title">{{ session.title }}</h1>
                </div>
                <p data-audience-status role="status">Conectando…</p>
            </div>
        </header>
        <section data-question-area class="answer-area answer-area--pro" aria-live="polite" aria-atomic="true">
            <div class="audience-waiting">
                <span class="audience-waiting-mark" aria-hidden="true">L</span>
                <h2>Esperando al presentador</h2>
                <p class="muted">La diapositiva activa aparecerá automáticamente.</p>
            </div>
        </section>
        <footer class="audience-footer" aria-label="Estado de participación">
            <span data-score>0 pts</span>
            <span data-connected-count>0 conectados</span>
            <span class="audience-footer-note">Tus respuestas se envían de forma privada.</span>
        </footer>
    </main>

    <script>
        window.MENTI_SESSION_CODE = {{ session.code|tojson }};
        window.MENTI_PARTICIPANT_TOKEN = {{ participant.token|tojson }};
    </script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/audience.js', v=asset_version) }}"></script>
</body>
</html>
